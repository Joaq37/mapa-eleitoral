name: Dados extra (anos 2002-2020)

# Roda no GitHub (nada é baixado para o computador): baixa os dados abertos do TSE,
# gera os JSONs e faz commit em site/data. Disparo manual: aba Actions > Run workflow.
on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos separados por espaço"
        default: "2002 2004 2006 2008 2010 2012 2014 2016"
        required: true

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas numpy

      - name: Baixar do TSE e gerar
        env:
          DATA_DIR: ${{ runner.temp }}/tse
        run: python pipeline/s8_anos.py --download ${{ github.event.inputs.anos }}

      - name: Commit dos dados gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "Dados gerados no GitHub Actions: ${{ github.event.inputs.anos }}" || echo "nada a commitar"
          git pull --rebase origin main
          git push
