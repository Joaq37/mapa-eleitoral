name: Sonda de layout (anos antigos)

on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/sonda.py 2002 2004 2006 2008 2010 2012 2014 2016
        env:
          DATA_DIR: ${{ runner.temp }}/sonda
